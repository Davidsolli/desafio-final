# ============================================================
# docker-compose.prod.yml — Configuração de produção
#
# RNF-12: Deploy via LXC
# RNF-07: restart=always para 99,5% de disponibilidade
# RNF-02: múltiplos workers Uvicorn via CMD no Dockerfile
#
# Uso:
#   docker compose -f docker-compose.prod.yml up -d
# ============================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omniconnect-api-prod
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - SECRET_KEY=${SECRET_KEY}
      - ENV=production
      - DATABASE_ECHO=false
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
    # Expõe apenas para nginx (não para o mundo externo)
    expose:
      - "8000"
    networks:
      - omniconnect_net
    # RNF-07: health check via endpoint dedicado
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # RNF-02: limites de recursos para garantir desempenho
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M

  db:
    image: ankane/pgvector:latest
    container_name: omniconnect-db-prod
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    env_file:
      - .env.prod
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      # Montagem do diretório de backups (RNF-09)
      - /var/backups/omniconnect:/var/backups/omniconnect
    networks:
      - omniconnect_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_prod:
    driver: local

networks:
  omniconnect_net:
    driver: bridge
