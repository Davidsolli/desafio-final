# ============================================================
# nginx.conf — Proxy reverso para a API OmniConnect Fitness
#
# RNF-03: Comunicações via HTTPS/TLS 1.3
# RNF-12: Deploy via LXC (este arquivo deve ser copiado para o
#          container LXC junto com os certificados SSL)
#
# Uso:
#   1. Gere certificados: certbot certonly --nginx -d seu.dominio.com
#   2. Copie este arquivo para /etc/nginx/sites-available/omniconnect
#   3. ln -s /etc/nginx/sites-available/omniconnect /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx
# ============================================================

# Redireciona HTTP → HTTPS (RNF-03)
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name seu.dominio.com;  # Substitua pelo domínio real

    # ── Certificados SSL (RNF-03) ─────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/seu.dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seu.dominio.com/privkey.pem;

    # TLS 1.3 + 1.2 (apenas versões seguras) — RNF-03
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    # HSTS: força HTTPS por 1 ano (RNF-03)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Cabeçalhos de segurança adicionais (RNF-10 LGPD)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Proxy para a API FastAPI (porta 8000) ─────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts — RNF-08 (resposta < 1.5s)
        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;

        # Buffers para performance
        proxy_buffering    on;
        proxy_buffer_size  8k;
        proxy_buffers      8 8k;
    }

    # ── Health check (RNF-07) ─────────────────────────────────────────────────
    location /api/v1/health {
        proxy_pass       http://127.0.0.1:8000/api/v1/health;
        access_log       off;
        add_header       Cache-Control "no-cache, no-store";
    }

    # ── Documentação Swagger (apenas em dev/staging) ──────────────────────────
    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
    }
    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
    }
}
