[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    asyncio: testes assíncronos com pytest-asyncio
    unit: testes unitários (sem banco real)
    integration: testes de integração (com banco in-memory)
    slow: testes que podem ser lentos
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
